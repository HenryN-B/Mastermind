{% extends 'base.html' %}
{% block content %}

<div class="table">
    <div class="game-box">
        <h1 class="title">Mastermind</h1>
        <div class="actions" id="actions">
            <button class="tile-button" id="create-button" type="button">New game</button>
            <button class="tile-button" id="join-button" type="button">Join game</button>
        </div>

        <div class="join-panel" id="join-panel" style="display: none;">
            <input id="room-code" class="code-input" placeholder="Room code" maxlength="4">
            <div class="join-panel-actions">
                <button class="tile-button small" id="Back" type="button">Back</button>
                <button class="tile-button small primary" id="join-confirm-button" type="button">Join</button>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{{url_for('static',filename='css/index.css')}}"/>
<script type="module" src="../static/assets/js/index.js"></script>

{% endblock %}
