{% extends 'base.html' %}
{% block content %}

<div class="table">
    <div class="game-box">
        <h1 class="title">Mastermind</h1>
        <p class="tagline" id="status-text">Waiting for players&hellip;</p>

        <div class="room-code-plaque">
            <span class="room-code-value" id="room-code-value">{{ data.code }}</span>
            {# <button class="copy-button" id="copy-button" type="button" title="Copy room code">Copy</button> #}
        </div>

        <p class="player-status">
            <span id="player-count">?</span> of 2 players here
        </p>

        <button class="tile-button primary" id="start" type="button" style="display: none;" disabled>
            Start game
        </button>
    </div>
</div>

<link rel="stylesheet" href="{{url_for('static',filename='css/room.css')}}"/>

<script>
    const game_data = {{ data | tojson | safe }};
</script>
<script type="module" src="../static/assets/js/room.js"></script>

{% endblock %}
